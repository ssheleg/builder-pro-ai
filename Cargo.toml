[workspace]
resolver = "2"
members = ["src-tauri", "crates/protocol", "crates/paths", "crates/daemon-core", "crates/sessiond", "crates/orchd-proto", "crates/orchd", "crates/secrets", "crates/mcp"]

[workspace.package]
edition = "2021"
# True floor of the resolved dep graph (verified against every locked Cargo.lock entry's own
# `rust-version`, both macOS targets — see CHANGELOG [0.3.0]): `plist`/`time`/`darling`/
# `serde_with` (pulled in transitively via `tauri`, present since before S2) declare 1.88.0, the
# highest of any resolved crate — higher than `trash` 5.2.6's 1.85.0 (the S2 regression that
# triggered this reconciliation). 1.77.2 was already false pre-S2; this is the honest number,
# still <= the pinned toolchain (rust-toolchain.toml, 1.92).
rust-version = "1.88.0"

[workspace.dependencies]
bpa-protocol = { path = "crates/protocol" }
bpa-paths = { path = "crates/paths" }
bpa-daemon-core = { path = "crates/daemon-core" }
bpa-orchd-proto = { path = "crates/orchd-proto" }
bpa-secrets = { path = "crates/secrets" }
bpa-mcp = { path = "crates/mcp" }

# Shared pins (spec §3). Owned individually by member crates via `workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not native-tls): avoids linking the platform TLS lib; matches the sandboxed/notarized
# desktop-egress posture (S-EXT §3, D2). bpa-mcp depends on this directly (not just via rmcp's
# own optional reqwest feature) so Cargo's feature unification gives rmcp's internal reqwest
# client a TLS backend too — see crates/mcp/Cargo.toml.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "signal"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ciborium = "0.2.2"
rustix = { version = "0.38", features = ["fs", "net", "process"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = "10"
thiserror = "1"
libc = "0.2"
tempfile = "3"
sha2 = "0.10"

# alacritty_terminal is pinned exact (grid model leaks into behavior; spec §3/§15).
alacritty_terminal = "=0.25.0"
