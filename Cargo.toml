[workspace]
resolver = "2"
members = ["src-tauri", "crates/protocol", "crates/paths", "crates/sessiond"]

[workspace.package]
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
bpa-protocol = { path = "crates/protocol" }
bpa-paths = { path = "crates/paths" }

# Shared pins (spec §3). Owned individually by member crates via `workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "signal"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ciborium = "0.2.2"
rustix = { version = "0.38", features = ["fs", "net", "process"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = "10"
thiserror = "1"
libc = "0.2"
tempfile = "3"

# alacritty_terminal is pinned exact (grid model leaks into behavior; spec §3/§15).
alacritty_terminal = "=0.25.0"
