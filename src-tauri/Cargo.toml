[package]
name = "builder-pro-ai"
version = "0.1.0"
description = "Builder Pro AI desktop app (Tauri core / broker)"
authors = ["Builder Pro AI"]
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "builder_pro_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
bpa-protocol = { workspace = true }
bpa-paths = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
ignore = "0.4.27"
trash = "5.2.3"
opener = { version = "0.8.5", features = ["reveal"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }

[features]
# Tauri custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
