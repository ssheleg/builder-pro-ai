name: ci
# GitHub runs the gate only on the PATH TO STABLE: pushes to `main` and PRs whose TARGET is `main`
# (i.e. the nightbuild -> main merge). The working branch (`nightbuild`) and feature/worktree
# branches are validated LOCALLY via `bash scripts/final-suite.sh` — GitHub does not auto-build them
# (keeps the 10x-billed macOS runners for the release path). See docs/branching.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: "unlock keychain (S-EXT: MCP/connector Keychain-gated tests + e2e phase7)"
        run: |
          # `bpa-secrets`'s unit tests, `crates/orchd`'s connector-account tests
          # (`accounts.rs`/`adapter.rs`), the `no_secrets_in_logs_mcp` integration test, and the
          # e2e `orchd-survive.mjs` phase7 (`ConnectorAddApiKey` + `ConnectorInvoke`) all write AND
          # read real macOS Keychain entries via `security-framework`. Every one of those already
          # has its own probe-and-skip guard, so a locked/absent keychain never fails the gate —
          # but a graceful skip forfeits real CI coverage of that whole surface. Create a throwaway
          # keychain, make it default + unlocked, AND — critically — ADD IT TO THE SEARCH LIST.
          # Keychain Services treats "default keychain" and "search list" as INDEPENDENT: an
          # unqualified `add-generic-password` (what `bpa_secrets::set` does) writes to the DEFAULT,
          # but an unqualified `find`/`delete` (what `bpa_secrets::get`/`delete` do) resolve the
          # SEARCH LIST. Without the search-list line, `set` succeeds while `get`/`delete` fail
          # "not found" — so the (now-hardened, set->get->delete round-trip) probes would SKIP and
          # CI would forfeit coverage silently. The search-list line prepends `ci.keychain-db`
          # while preserving the runner's existing user keychains (login.keychain-db, …). Standard
          # recipe (matches fastlane's create-keychain action); the runner VM is torn down after
          # the job, so no explicit cleanup is needed.
          security create-keychain -p "" ci.keychain-db
          security list-keychains -d user -s ci.keychain-db $(security list-keychains -d user | sed 's/[",]//g')
          security default-keychain -s ci.keychain-db
          security unlock-keychain -p "" ci.keychain-db
          security set-keychain-settings -lut 21600 ci.keychain-db
      - uses: dtolnay/rust-toolchain@stable # rustup honors rust-toolchain.toml (1.92)
      - uses: Swatinem/rust-cache@v2
      - name: english-only gate (no Cyrillic outside allowlist — spec D2 / O-2)
        # Cheap textual lint, run before the expensive Rust/e2e steps so it fails fast. Mirrors
        # the first stage of scripts/final-suite.sh — keep the two in lockstep (CONTRIBUTING.md).
        run: bash scripts/check-english.sh
      - name: UX-scenarios sync reminder (advisory, non-blocking — S-UXR A2)
        # Warns (never fails) when UI files changed without docs/qa/ux-scenarios.md. Mirrors the
        # advisory stage in scripts/final-suite.sh (CONTRIBUTING.md keeps them in lockstep).
        continue-on-error: true
        run: bash scripts/check-ux-scenarios.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: stage sidecars (tauri build.rs requires BOTH daemons in a fresh checkout)
        run: |
          cargo build -p bpa-sessiond -p bpa-orchd
          mkdir -p src-tauri/binaries
          TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          cp target/debug/bpa-sessiond "src-tauri/binaries/bpa-sessiond-$TRIPLE"
          cp target/debug/bpa-orchd "src-tauri/binaries/bpa-orchd-$TRIPLE"
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rust tests
        run: cargo test --workspace
      - name: real-shell integration tests actually ran
        run: |
          # These tests silently no-op when the shell binary is absent — assert the shells
          # exist on this runner, then run the named tests so a skip can never masquerade
          # as coverage (docs/backlog.md BL-16).
          test -x /bin/zsh && test -x /bin/bash
          out=$(cargo test -p bpa-sessiond shell_integration 2>&1)
          echo "$out"
          echo "$out" | grep -E "zsh_emits_osc_sequence_in_order .* ok" >/dev/null
          echo "$out" | grep -E "bash_emits_osc_sequence_in_order .* ok" >/dev/null
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run
      - name: ts-rs parity
        run: |
          cargo test -p bpa-protocol --test ts_export
          git diff --exit-code -- src/ipc/types.ts
          cargo test -p bpa-orchd-proto --test ts_export
          git diff --exit-code -- src/ipc/orchd-types.ts
      - name: e2e survive-restart
        run: |
          cargo build -p bpa-sessiond
          cargo build -p bpa-orchd
          npm run e2e:survive
      - name: e2e orchd survive+roundtrip
        # BPA_REQUIRE_KEYCHAIN=1 (BL-106): this job's "unlock keychain" step provisions an unlocked
        # search-list keychain, so phase7 (connector/keychain survival) MUST run — a SKIP here means
        # keychain provisioning regressed and must fail the gate instead of passing vacuously.
        env:
          BPA_REQUIRE_KEYCHAIN: "1"
        run: npm run e2e:orchd

  coverage:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: "unlock keychain (S-EXT: MCP/connector Keychain-gated tests under instrumentation)"
        run: |
          # Same rationale as the `gates` job's identical step (see there for the full "default vs
          # search list" explanation): `cargo llvm-cov`'s instrumented run re-executes every
          # Keychain-gated test (bpa-secrets, connectors::accounts, no_secrets_in_logs_mcp) under
          # this job's own process — give it a writable default keychain THAT IS ALSO ON THE SEARCH
          # LIST so `get`/`delete` resolve it and the coverage measurement exercises the real path,
          # not the skip guard.
          security create-keychain -p "" ci.keychain-db
          security list-keychains -d user -s ci.keychain-db $(security list-keychains -d user | sed 's/[",]//g')
          security default-keychain -s ci.keychain-db
          security unlock-keychain -p "" ci.keychain-db
          security set-keychain-settings -lut 21600 ci.keychain-db
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage gate (sessiond + orchd >= 80%)
        run: bash scripts/coverage-gate.sh
